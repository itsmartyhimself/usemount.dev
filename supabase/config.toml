# usemount.dev — Supabase project config.
#
# Hosted project: ref agyiylncvchzifuzvnew (org itsmartyhimself, region eu-west-1,
# Postgres 17). The project ref is public-by-design — it ships to browsers inside
# NEXT_PUBLIC_SUPABASE_URL — so it is safe to commit here. No secret values live
# in this file; runtime keys are in the gitignored .env.local files.
#
# supabase/migrations/ is the source of truth for schema. Migrations are applied
# to the hosted DB via the Management API (PAT-authenticated) during the migration
# build — see migration-plan.md. This file is intentionally minimal; run
# `supabase init` to expand it for full local-stack development.

project_id = "agyiylncvchzifuzvnew"

# site_url + redirect allow-list mirror the hosted auth config (PATCHed via the
# Management API in PR2) so a future `supabase db reset` / local stack doesn't
# revert production OAuth. *.up.railway.app is temporary — the custom-domain
# pass updates this together with the GitHub App + Railway env.
[auth]
site_url = "https://web-production-18dfa1.up.railway.app"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "https://web-production-18dfa1.up.railway.app",
  "https://web-production-18dfa1.up.railway.app/auth/callback",
]

# GitHub provider was ENABLED in PR1 (its client_id / client_secret double as
# the Supabase GitHub OAuth credentials — the seam that lets Step 3 match an
# App installation back to a user). Kept true here to match the hosted config.
[auth.external.github]
enabled = true

# Google provider is DEFERRED to a PR2.x follow-up (R1): it needs a Google
# Cloud OAuth client, a separate one-time console setup outside this CLI's
# reach. The login button shows "coming soon" until then.
[auth.external.google]
enabled = false
