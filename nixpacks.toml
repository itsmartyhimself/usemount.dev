# Adds `git` to the Nix build environment so the api build worker's shallow
# clone (apps/api/src/build/clone.ts) works at RUNTIME — git is NOT on a
# Railway/Nixpacks image by default (the "spawn git ENOENT" trap; migration-log
# PR19 <live-debug>). The "..." token preserves Nixpacks' auto-detected
# node/pnpm packages and appends git (additive, not a replace).
#
# Both the `api` and `web` Railway services use the REPO ROOT as their Root
# Directory (DEPLOY.md Part 1), so this file applies to BOTH builds; git on the
# web image is unused but harmless. The NIXPACKS_PKGS=git env var on the api
# service stays as a safety net until this committed file is proven the sole
# provider (see migration-log PR21 <known-risks>).
[phases.setup]
nixPkgs = ["...", "git"]
